<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning 3x8</title>
<meta name="description" content="Poste du jour et calendrier de rotation 3x8.">
<meta name="theme-color" content="#e7e8e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<script>
  try {
    if (localStorage.getItem('calc.theme') === 'dark') document.documentElement.classList.add('sombre');
  } catch (e) {}
</script>
<style>
/* Mêmes jetons que le calculateur NST : les deux outils sont du même poste,
   ils doivent se ressembler. Rien n'est chargé depuis l'extérieur — la page
   s'affiche à l'identique sans réseau. */
:root {
  --sol:#e7e8e3; --surface:#fdfdfc; --surface-2:#f2f3ef;
  --trait:#d2d4cc; --encre:#16191c; --encre-2:#5c6159;
  --panneau:#16191c; --panneau-2:#22262a; --panneau-tx:#f4f5f2; --panneau-tx2:#9aa09a;
  --ambre:#a8600a; --ambre-clair:#e3a040; --ambre-fond:#f5e6cd;
  --focus:#a8600a;
  --police: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* Le poste se lit à la valeur, pas à la teinte : clair le matin, sombre la
     nuit. Une seule famille de gris remplace les trois couleurs saturées. */
  --matin:#e7ebdf;
  --aprem:#c6ccbb;
  --nuit:#949e8f;
}
:root.sombre {
  --sol:#101316; --surface:#191d21; --surface-2:#14181b;
  --trait:#2b3136; --encre:#eceee9; --encre-2:#99a0a6;
  --panneau:#060809; --panneau-2:#14181b;
  --ambre:#e3a040; --ambre-fond:#332509;
  --focus:#e0a53c;
  /* L'echelle reste ordonnee (matin clair -> nuit sombre) mais demarre
     au-dessus du fond de la carte : plus bas, les semaines de nuit se
     confondaient avec le fond et la ligne paraissait vide. */
  --matin:#4c555c;
  --aprem:#363e44;
  --nuit:#242a2f;
}

* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; background:var(--sol); color:var(--encre);
  font-family:var(--police); font-size:16px; line-height:1.45;
  padding:0 14px calc(28px + env(safe-area-inset-bottom));
}
.page { max-width:560px; margin:0 auto; }

.barre {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
}
h1 { margin:0; font-size:15px; font-weight:700; letter-spacing:-0.01em; }

.bouton {
  font:inherit; font-size:15px; font-weight:650; color:var(--encre);
  background:var(--surface); border:1px solid var(--trait); border-radius:9px;
  min-height:44px; min-width:44px; padding:10px 14px; cursor:pointer;
}
.bouton:hover { border-color:var(--encre-2); }
.bouton:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }

/* ===== Le poste du jour : l'élément fort ===== */
.aujourdhui {
  background:var(--panneau); border:1px solid transparent; border-radius:14px;
  overflow:hidden; margin-bottom:14px;
}
:root.sombre .aujourdhui { border-color:var(--trait); }

.aujourdhui-date {
  padding:11px 16px; background:var(--panneau-2);
  font-size:13px; color:var(--panneau-tx2);
  display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
}
.aujourdhui-corps { padding:15px 16px 17px; }
.poste-nom {
  font-size:40px; font-weight:800; letter-spacing:-0.02em; line-height:1.05;
  color:var(--panneau-tx); margin:0;
}
.poste-heures {
  font-size:17px; font-weight:650; color:var(--ambre-clair); margin-top:4px;
  font-variant-numeric:tabular-nums;
}
.poste-note { font-size:13px; color:var(--panneau-tx2); margin-top:6px; }

/* ===== Calendrier ===== */
.mois {
  background:var(--surface); border:1px solid var(--trait);
  border-radius:14px; padding:12px; margin-bottom:14px;
}
.mois-tete {
  display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;
}
.mois-nom { font-size:15px; font-weight:700; text-transform:capitalize; }

/* Colonne de gauche : le poste de la semaine. En 3x8 il ne change pas d'un
   jour à l'autre, donc une marque par ligne suffit — sept pastilles par
   semaine répétaient la même information. */
.grille { display:grid; grid-template-columns:34px repeat(7, 1fr); gap:2px; }

.entete {
  font-size:11px; font-weight:700; color:var(--encre-2);
  text-align:center; padding:4px 0;
}

.semaine-poste {
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:var(--encre-2);
  border-radius:7px 0 0 7px;
}

.jour {
  position:relative; min-height:42px; padding:5px 2px 3px;
  text-align:center; font-size:14px; font-variant-numeric:tabular-nums;
  border-radius:3px;
}
.jour-matin { background:var(--matin); }
.jour-aprem { background:var(--aprem); }
.jour-nuit  { background:var(--nuit); }
.jour-vide  { background:transparent; }
.jour-horsmois { opacity:.34; }

.jour-num { font-weight:650; }

/* Aujourd'hui : un cadre, pas un aplat — l'aplat sert déjà au poste. */
.jour-today { outline:2.5px solid var(--encre); outline-offset:-2.5px; border-radius:7px; }
.jour-today .jour-num { font-weight:800; }

/* Fermeture ou férié : l'ambre est la seule couleur de la page, elle ne
   signale que ça. */
.jour-ferme { background:var(--ambre-fond); }
.jour-ferme .jour-num { color:var(--ambre); font-weight:800; }
.pastille {
  display:block; width:5px; height:5px; border-radius:50%;
  background:var(--ambre); margin:2px auto 0;
}
.ecole {
  display:block; height:2px; border-radius:1px;
  background:var(--encre-2); opacity:.42; margin:3px 6px 0;
}

.legende {
  display:flex; flex-wrap:wrap; gap:8px 14px;
  margin-top:11px; padding-top:11px; border-top:1px solid var(--trait);
  font-size:12px; color:var(--encre-2);
}
.legende span { display:inline-flex; align-items:center; gap:5px; }
.puce { width:11px; height:11px; border-radius:3px; border:1px solid var(--trait); }

.avis {
  background:var(--ambre-fond); border:1px solid var(--ambre);
  border-radius:11px; padding:11px 13px; margin-bottom:14px;
  font-size:13px; color:var(--encre);
}
.avis b { color:var(--ambre); }
.cache { display:none; }
.invisible {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

@media (max-width:359px) {
  .grille { grid-template-columns:26px repeat(7, 1fr); gap:1px; }
  .jour { min-height:38px; font-size:13px; }
  .poste-nom { font-size:34px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { transition-duration:.001ms !important; animation-duration:.001ms !important; }
}
</style>
</head>
<body>
<div class="page">

  <header class="barre">
    <h1>Planning 3x8</h1>
    <button id="btnTheme" class="bouton" type="button" aria-label="Passer au thème sombre">☾</button>
  </header>

  <section class="aujourdhui">
    <div class="aujourdhui-date">
      <span id="dateJour">—</span>
      <span id="etiquetteJour"></span>
    </div>
    <div class="aujourdhui-corps">
      <p class="poste-nom" id="posteNom">—</p>
      <div class="poste-heures" id="posteHeures"></div>
      <div class="poste-note" id="posteNote"></div>
    </div>
  </section>

  <div id="avisDonnees" class="avis cache"></div>

  <section class="mois">
    <div class="mois-tete">
      <button id="moisPrec" class="bouton" type="button" aria-label="Mois précédent">‹</button>
      <span class="mois-nom" id="moisNom">—</span>
      <button id="moisSuiv" class="bouton" type="button" aria-label="Mois suivant">›</button>
    </div>

    <div class="grille" id="grille" role="grid" aria-labelledby="moisNom"></div>

    <div class="legende">
      <span><i class="puce" style="background:var(--matin)"></i>Matin</span>
      <span><i class="puce" style="background:var(--aprem)"></i>Après-midi</span>
      <span><i class="puce" style="background:var(--nuit)"></i>Nuit</span>
      <span><i class="puce" style="background:var(--ambre-fond);border-color:var(--ambre)"></i>Fermé / férié</span>
      <span><i class="ecole" style="width:14px;margin:0"></i>Vacances scolaires</span>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  const $ = function (id) { return document.getElementById(id); };

  // ===== Rotation =====
  // Le cycle est calculé, pas listé : il reste juste indéfiniment.
  const CYCLE = ['B', 'A', 'C'];
  const POSTES = {
    A: { nom: 'Matin',      heures: '06h – 14h', classe: 'jour-matin' },
    B: { nom: 'Après-midi', heures: '14h – 22h', classe: 'jour-aprem' },
    C: { nom: 'Nuit',       heures: '22h – 06h', classe: 'jour-nuit'  }
  };
  const REFERENCE = new Date(2026, 0, 19); // un lundi, début de cycle connu

  // ===== Données propres au site =====
  // Séparées du code : ajouter une année revient à ajouter un bloc ici.
  // Tant qu'une année manque, la page le dit au lieu d'afficher un calendrier
  // muet — c'est le piège de la version précédente, qui n'avait que 2026 et
  // n'aurait plus rien signalé à partir du 1er janvier 2027.
  const DONNEES = {
    2026: {
      vacances: [
        ['2026-02-07', '2026-02-22', 'Vacances d’hiver'],
        ['2026-04-04', '2026-04-19', 'Vacances de printemps'],
        ['2026-07-04', '2026-09-01', 'Grandes vacances'],
        ['2026-10-17', '2026-11-01', 'Vacances de la Toussaint'],
        ['2026-12-19', '2027-01-03', 'Vacances de Noël']
      ],
      fermetures: [
        '2026-03-19', '2026-03-20',
        '2026-04-11', '2026-04-12', '2026-04-30',
        '2026-05-01', '2026-05-02', '2026-05-03', '2026-05-14', '2026-05-15',
        '2026-06-11', '2026-06-12',
        '2026-09-10', '2026-09-11', '2026-09-25',
        '2026-10-23', '2026-10-24', '2026-10-25', '2026-10-26',
        '2026-11-12', '2026-11-13',
        '2026-12-10', '2026-12-11'
      ]
    }
  };

  // ===== Dates =====
  function cle(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function lundiDe(d) {
    const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const jour = c.getDay();
    c.setDate(c.getDate() - (jour === 0 ? 6 : jour - 1));
    return c;
  }

  function posteDe(date) {
    // En semaines pleines plutôt qu'en millisecondes : les changements
    // d'heure décalent la journée d'une heure et fausseraient une division.
    const a = lundiDe(REFERENCE), b = lundiDe(date);
    const semaines = Math.round((b - a) / 604800000);
    return CYCLE[((semaines % 3) + 3) % 3];
  }

  /** Jours fériés français, Pâques comprise (algorithme de Meeus). */
  function feries(annee) {
    const f = {};
    const pose = function (d, nom) { f[cle(d)] = nom; };
    pose(new Date(annee, 0, 1),  'Jour de l’an');
    pose(new Date(annee, 4, 1),  'Fête du Travail');
    pose(new Date(annee, 4, 8),  'Victoire 1945');
    pose(new Date(annee, 6, 14), 'Fête nationale');
    pose(new Date(annee, 7, 15), 'Assomption');
    pose(new Date(annee, 10, 1), 'Toussaint');
    pose(new Date(annee, 10, 11),'Armistice');
    pose(new Date(annee, 11, 25),'Noël');

    const a = annee % 19, b = Math.floor(annee / 100), c = annee % 100;
    const d = Math.floor(b / 4), e = b % 4;
    const g = Math.floor((b - Math.floor((b + 8) / 25) + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mois = Math.floor((h + l - 7 * m + 114) / 31);
    const jour = ((h + l - 7 * m + 114) % 31) + 1;
    const paques = new Date(annee, mois - 1, jour);

    const decale = function (n) {
      const x = new Date(paques); x.setDate(paques.getDate() + n); return x;
    };
    pose(decale(1),  'Lundi de Pâques');
    pose(decale(39), 'Ascension');
    pose(decale(50), 'Lundi de Pentecôte');
    return f;
  }

  /** Fermetures de l'année demandée, plus celles d'une année voisine. */
  function fermetures(annee) {
    const s = {};
    [annee - 1, annee, annee + 1].forEach(function (an) {
      const bloc = DONNEES[an];
      if (bloc) bloc.fermetures.forEach(function (k) { s[k] = true; });
    });
    return s;
  }

  /** Vacances scolaires, y compris celles à cheval sur deux années. */
  function vacances(annee) {
    const r = [];
    [annee - 1, annee, annee + 1].forEach(function (an) {
      const bloc = DONNEES[an];
      if (bloc) bloc.vacances.forEach(function (v) {
        r.push({ debut: v[0], fin: v[1], nom: v[2] });
      });
    });
    return r;
  }

  function vacanceDe(k, plages) {
    for (let i = 0; i < plages.length; i++) {
      if (k >= plages[i].debut && k <= plages[i].fin) return plages[i].nom;
    }
    return null;
  }

  // ===== Affichage =====
  let moisAffiche = new Date();

  function rendreAujourdhui() {
    const now = new Date();
    const aujourdhui = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const k = cle(aujourdhui);
    const poste = POSTES[posteDe(aujourdhui)];

    $('dateJour').textContent = aujourdhui.toLocaleDateString('fr-FR',
      { weekday: 'long', day: 'numeric', month: 'long' });

    const ferie = feries(aujourdhui.getFullYear())[k];
    const ferme = fermetures(aujourdhui.getFullYear())[k];
    const vac = vacanceDe(k, vacances(aujourdhui.getFullYear()));

    const etiquette = ferie || (ferme ? 'Fermeture' : '');
    $('etiquetteJour').textContent = etiquette;

    if (ferie || ferme) {
      $('posteNom').textContent = ferie ? ferie : 'Fermé';
      $('posteHeures').textContent = '';
      $('posteNote').textContent = 'Poste de la semaine : ' + poste.nom + ', ' + poste.heures;
    } else {
      $('posteNom').textContent = poste.nom;
      $('posteHeures').textContent = poste.heures;
      $('posteNote').textContent = vac ? vac : '';
    }
  }

  function rendreMois() {
    const annee = moisAffiche.getFullYear();
    const mois = moisAffiche.getMonth();

    $('moisNom').textContent = new Date(annee, mois)
      .toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

    // Prévenir quand les données du site manquent pour l'année affichée.
    const avis = $('avisDonnees');
    if (!DONNEES[annee]) {
      avis.innerHTML = '<b>Données ' + annee + ' absentes.</b> Les postes restent justes, ' +
        'mais les fermetures, ponts et vacances scolaires de cette année ne sont pas ' +
        'encore renseignés — le calendrier ne les affichera pas.';
      avis.classList.remove('cache');
    } else {
      avis.classList.add('cache');
    }

    const jFeries = feries(annee);
    const jFermes = fermetures(annee);
    const plages = vacances(annee);

    const now = new Date();
    const kToday = cle(new Date(now.getFullYear(), now.getMonth(), now.getDate()));

    const grille = $('grille');
    grille.innerHTML = '';

    ['', 'L', 'M', 'M', 'J', 'V', 'S', 'D'].forEach(function (t, i) {
      const c = document.createElement('div');
      c.className = 'entete';
      c.textContent = t;
      if (t) c.setAttribute('aria-label',
        ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'][i - 1]);
      grille.appendChild(c);
    });

    // On parcourt par semaines entières, du lundi précédant le 1er du mois
    // jusqu'à couvrir le dernier jour.
    const premier = new Date(annee, mois, 1);
    const dernier = new Date(annee, mois + 1, 0);
    let curseur = lundiDe(premier);

    while (curseur <= dernier) {
      const code = posteDe(curseur);
      const poste = POSTES[code];

      const marque = document.createElement('div');
      marque.className = 'semaine-poste';
      marque.textContent = code;
      marque.title = poste.nom + ' (' + poste.heures + ')';
      marque.setAttribute('aria-label', 'Semaine en ' + poste.nom);
      grille.appendChild(marque);

      for (let i = 0; i < 7; i++) {
        const d = new Date(curseur.getFullYear(), curseur.getMonth(), curseur.getDate() + i);
        const k = cle(d);
        const dansLeMois = d.getMonth() === mois;

        const cellule = document.createElement('div');
        const ferie = jFeries[k];
        const ferme = jFermes[k];
        const vac = vacanceDe(k, plages);

        let classes = 'jour ' + ((ferie || ferme) ? 'jour-ferme' : poste.classe);
        if (!dansLeMois) classes += ' jour-horsmois';
        if (k === kToday) classes += ' jour-today';
        cellule.className = classes;

        const num = document.createElement('span');
        num.className = 'jour-num';
        num.textContent = d.getDate();
        cellule.appendChild(num);

        if (ferie || ferme) {
          const p = document.createElement('i');
          p.className = 'pastille';
          cellule.appendChild(p);
        } else if (vac) {
          const b = document.createElement('i');
          b.className = 'ecole';
          cellule.appendChild(b);
        }

        const dit = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }) +
          ' — ' + (ferie ? ferie : (ferme ? 'fermeture' : poste.nom)) + (vac ? ', ' + vac : '');
        cellule.title = dit;
        cellule.setAttribute('role', 'gridcell');
        cellule.setAttribute('aria-label', dit);

        grille.appendChild(cellule);
      }

      curseur = new Date(curseur.getFullYear(), curseur.getMonth(), curseur.getDate() + 7);
    }
  }

  function changerMois(delta) {
    moisAffiche = new Date(moisAffiche.getFullYear(), moisAffiche.getMonth() + delta, 1);
    rendreMois();
  }

  function appliquerTheme() {
    let sombre = false;
    try { sombre = localStorage.getItem('calc.theme') === 'dark'; } catch (e) {}
    document.documentElement.classList.toggle('sombre', sombre);
    const b = $('btnTheme');
    b.textContent = sombre ? '☀' : '☾';
    b.setAttribute('aria-label', sombre ? 'Passer au thème clair' : 'Passer au thème sombre');
  }

  document.addEventListener('DOMContentLoaded', function () {
    appliquerTheme();
    $('btnTheme').addEventListener('click', function () {
      try {
        localStorage.setItem('calc.theme',
          localStorage.getItem('calc.theme') === 'dark' ? 'light' : 'dark');
      } catch (e) {}
      appliquerTheme();
    });

    $('moisPrec').addEventListener('click', function () { changerMois(-1); });
    $('moisSuiv').addEventListener('click', function () { changerMois(1); });

    rendreAujourdhui();
    rendreMois();
  });
})();
</script>
</body>
</html>
